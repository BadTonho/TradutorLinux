name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debug-and-analysis:
    name: Debug, testes e análise estática
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install --yes \
            build-essential cmake ninja-build llvm clang-tidy cppcheck \
            gcc-mingw-w64-x86-64-win32 libx11-dev xvfb qt6-base-dev

      - name: Configurar Debug
        run: cmake --preset debug

      - name: Compilar Debug
        run: cmake --build --preset debug --parallel

      - name: Executar testes Debug
        run: ctest --preset debug --output-on-failure

      - name: Executar cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem \
            --std=c++20 --language=c++ -I include src

      - name: Executar clang-tidy
        run: |
          clang-tidy --config-file=.clang-tidy --warnings-as-errors='*' \
            -p build/debug src/main.cpp src/cli.cpp src/diagnostics/trace.cpp \
            src/pe/pe_reader.cpp src/loader/image_mapper.cpp src/loader/module.cpp \
            src/loader/import_resolver.cpp src/loader/process.cpp src/runtime/winapi.cpp \
            src/process/isolate.cpp \
            src/gui/x11.cpp

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install --yes build-essential cmake ninja-build llvm gcc-mingw-w64-x86-64-win32 libx11-dev xvfb qt6-base-dev

      - name: Configurar Sanitizers
        run: cmake --preset sanitize

      - name: Compilar Sanitizers
        run: cmake --build --preset sanitize --parallel

      - name: Executar testes Sanitizers
        run: ctest --preset sanitize --output-on-failure

  rust-ffi:
    name: Rust FFI (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug-rust, sanitize-rust, release-rust]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install --yes \
            build-essential cmake ninja-build llvm gcc-mingw-w64-x86-64-win32 \
            libx11-dev xvfb qt6-base-dev

      - name: Instalar toolchain Rust fixada
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Configurar ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Compilar probe Rust
        run: cmake --build --preset ${{ matrix.preset }} --target tl_rust_ffi_probe --parallel 2

      - name: Executar probe Rust
        run: ctest --preset ${{ matrix.preset }} -R '^rust_ffi_probe$' --output-on-failure

  target-apps:
    name: Aplicativos-alvo reais (cross-build e imports)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install --yes \
            build-essential cmake ninja-build llvm gcc-mingw-w64-x86-64-win32 \
            qt6-base-dev

      - name: Configurar com TL_BUILD_TARGET_APPS
        run: |
          cmake -S . -B build/targetapps -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DTL_BUILD_TARGET_APPS=ON

      - name: Compilar (runtime + aplicativos-alvo)
        run: cmake --build build/targetapps --parallel

      - name: Verificar imports dos aplicativos-alvo
        run: ctest --test-dir build/targetapps -L targetapp --output-on-failure
